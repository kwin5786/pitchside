<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitchside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0E1512;
    --text: #E6EDE9;
    --muted: #9FB0A8;
    --panel: #141D19;
    --border: #2E3B36;
    --btn: #1A2420;
    --green: #2E7D4F;
    --blue: #2563EB;
    --orange: #C2410C;
    --amber: #E0A800;
    --touch: 44px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .num { font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-variant-numeric: tabular-nums; }

  /* ---------- Buttons ---------- */
  button {
    font: inherit;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--border);
    border-radius: 9px;
    min-height: var(--touch);
    min-width: var(--touch);
    padding: 0 16px;
    cursor: pointer;
    font-weight: 600;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  button:active { filter: brightness(1.25); }
  button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }

  /* ---------- Layout ---------- */
  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 16px 24px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }
  .brand {
    margin: 0;
    margin-right: auto;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .role-badge {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .role-badge.scorer { color: #fff; background: var(--green); border-color: var(--green); }

  .panels { display: flex; flex-direction: column; gap: 12px; }

  .screen[hidden] { display: none; }
  .back-btn { padding: 0 12px; font-size: 20px; line-height: 1; }

  /* ---------- Launch screen ---------- */
  .launch { display: flex; flex-direction: column; gap: 16px; max-width: 480px; margin: 0 auto; }
  .hero {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; height: 104px; width: 100%;
    background: var(--green); border-color: var(--green); color: #fff;
    font-size: 17px; font-weight: 700; letter-spacing: 0.04em; border-radius: 14px;
  }
  .tiles { display: flex; gap: 9px; }
  .tile {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; height: 72px; padding: 0 6px; border-radius: 11px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
  }
  .no-match {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 26px 18px; text-align: center;
  }
  .no-match strong { display: block; font-size: 16px; color: #fff; margin-bottom: 8px; }
  .no-match span { font-size: 13px; color: var(--muted); }
  .section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted);
  }
  .launch-foot { width: 100%; height: 48px; font-size: 12px; letter-spacing: 0.06em; }
  body[data-role="viewer"] .scorer-only { display: none; }
  body[data-role="scorer"] .viewer-only { display: none; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 14px 16px;
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 600;
  }
  .empty {
    color: var(--muted);
    padding: 10px 0;
  }
  .panel-foot {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--muted);
    word-break: break-word;
  }
  .panel-foot.error { color: var(--amber); }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .panel-head h2 { margin: 0; }

  /* ---------- Player library ---------- */
  .player-list { display: flex; flex-direction: column; }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: var(--touch);
    width: 100%;
    padding: 6px 0;
    text-align: left;
    font-weight: 400;
  }
  button.player-row {
    background: none;
    border: 0;
    border-radius: 0;
  }
  .player-row + .player-row { border-top: 1px solid var(--border); }
  .initials {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #2E3B36;
    color: #E6EDE9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 15px;
  }
  .player-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .f-tag {
    flex: none;
    background: #F2F5F3;
    color: #141413;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 7px;
    border-radius: 999px;
  }

  /* ---------- Teams ---------- */
  .colour-dot {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 40px;
    height: 40px;
    min-width: 40px;
    min-height: 40px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid var(--border);
  }
  .swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 3px var(--panel); }
  .squad-picker {
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0 12px;
  }
  .squad-count { font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
  button.squad-row[aria-pressed="true"] { background: rgba(46, 125, 79, 0.22); }
  .squad-tick {
    flex: none;
    margin-left: auto;
    color: var(--green);
    font-weight: 700;
    visibility: hidden;
  }
  button.squad-row[aria-pressed="true"] .squad-tick { visibility: visible; }

  /* ---------- Forms ---------- */
  .field-label {
    display: block;
    margin: 10px 0 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .text-input {
    width: 100%;
    min-height: var(--touch);
    padding: 0 12px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
  }
  .text-input:focus { outline: 2px solid var(--muted); outline-offset: 1px; }
  .seg { display: flex; gap: 10px; }
  .seg .toggle { min-width: 64px; }
  .toggle[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .form-msg { min-height: 20px; margin: 12px 0; font-size: 13px; color: var(--amber); }
  button.danger { color: var(--amber); margin-right: auto; }
  button:disabled { opacity: 0.45; cursor: default; filter: none; }

  /* ---------- Modals ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(5, 9, 7, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    width: 100%;
    max-width: 560px;
    max-height: 100%;
    overflow: auto;
    padding: 16px;
  }
  .modal h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .modal p { margin: 0 0 14px; color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

  /* PIN entry: side-by-side in landscape, stacked on narrow portrait */
  .pin-modal { display: flex; gap: 18px; align-items: stretch; }
  .pin-left {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }
  .pin-dots { display: flex; gap: 12px; margin: 4px 0; }
  .pin-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
  }
  .pin-dot.filled { background: var(--text); border-color: var(--text); }
  .pin-dots.shake { animation: shake 0.35s; }
  .pin-msg { min-height: 20px; font-size: 13px; color: var(--amber); }
  .pin-pad {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-auto-rows: 48px;
    gap: 8px;
  }
  .pin-pad button {
    padding: 0;
    font-family: 'Barlow Condensed', 'Barlow', sans-serif;
    font-size: 24px;
  }
  .pin-pad button.key-fn { font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--muted); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  @media (max-width: 480px) {
    .pin-modal { flex-direction: column; align-items: center; }
    .pin-left { width: 100%; }
  }

  /* Tablet and up */
  @media (min-width: 900px) {
    .app { padding: 16px 24px 32px; }
    .brand { font-size: 30px; }
    .panel { padding: 18px 20px; }
    .panels { gap: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button type="button" id="backBtn" class="back-btn" hidden aria-label="Back">&#8592;</button>
    <h1 class="brand">Pitchside</h1>
    <div class="topbar-right">
      <span id="roleBadge" class="role-badge">Viewer</span>
    </div>
  </header>

  <main class="panels">
    <section class="screen" id="screenLaunch" hidden>
      <div class="launch">
        <button type="button" class="hero scorer-only" id="startMatchBtn" disabled>START A MATCH</button>

        <div class="no-match viewer-only">
          <strong>No match right now</strong>
          <span>When a match kicks off, the score and clock will appear here.</span>
        </div>

        <div class="tiles">
          <button type="button" class="tile" id="tileTeams">TEAMS</button>
          <button type="button" class="tile" id="tileTournament" disabled>TOURNAMENT</button>
          <button type="button" class="tile" id="tileSetup">SETUP</button>
        </div>

        <div class="section-label">RECENT RESULTS</div>
        <div class="empty" id="recentResults">No matches yet</div>

        <button id="signInBtn" type="button" class="launch-foot">Scorer sign in</button>
        <button id="signOutBtn" type="button" class="launch-foot" hidden>Sign out</button>
      </div>
    </section>

    <section class="screen" id="screenPlayers" hidden>
    <section class="panel" id="playersPanel">
      <div class="panel-head">
        <h2>Players</h2>
        <button type="button" id="addPlayerBtn" hidden>Add player</button>
      </div>
      <div class="player-list" id="playersList"></div>
      <div class="panel-foot" id="playersStatus">Loading players…</div>
    </section>
    </section>

    <section class="screen" id="screenTeams" hidden>
    <section class="panel" id="teamsPanel">
      <div class="panel-head">
        <h2>Teams</h2>
        <button type="button" id="addTeamBtn" hidden>Add team</button>
      </div>
      <div class="player-list" id="teamsList"></div>
      <div class="panel-foot" id="teamsStatus">Loading teams…</div>
    </section>
    </section>
  </main>
</div>

<!-- PIN entry -->
<div class="overlay" id="pinOverlay" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
  <div class="modal pin-modal">
    <div class="pin-left">
      <div>
        <h3 id="pinTitle">Scorer sign in</h3>
        <p>Enter the 4-digit scorer PIN.</p>
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span><span class="pin-dot"></span>
          <span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <div class="pin-msg" id="pinMsg" aria-live="polite"></div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start">
        <button type="button" id="pinCancel">Cancel</button>
      </div>
    </div>
    <div class="pin-pad" id="pinPad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="clear" class="key-fn">Clear</button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="back" class="key-fn" aria-label="Delete">⌫</button>
    </div>
  </div>
</div>

<!-- Add / edit player -->
<div class="overlay" id="playerOverlay" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
  <div class="modal" style="max-width:420px">
    <h3 id="playerTitle">Add player</h3>
    <label class="field-label" for="playerName">Name</label>
    <input class="text-input" id="playerName" type="text" autocomplete="off" maxlength="80">
    <div class="field-label">Gender</div>
    <div class="seg" id="playerGender">
      <button type="button" class="toggle" data-gender="M" aria-pressed="false">M</button>
      <button type="button" class="toggle" data-gender="F" aria-pressed="false">F</button>
    </div>
    <div class="form-msg" id="playerMsg" aria-live="polite"></div>
    <div class="modal-actions">
      <button type="button" id="playerDelete" class="danger" hidden>Delete</button>
      <button type="button" id="playerCancel">Cancel</button>
      <button type="button" id="playerSave" class="primary" disabled>Save</button>
    </div>
  </div>
</div>

<!-- Add / edit team -->
<div class="overlay" id="teamOverlay" role="dialog" aria-modal="true" aria-labelledby="teamTitle">
  <div class="modal" style="max-width:480px">
    <h3 id="teamTitle">Add team</h3>
    <label class="field-label" for="teamName">Name</label>
    <input class="text-input" id="teamName" type="text" autocomplete="off" maxlength="60">
    <div class="field-label">Colour</div>
    <div class="swatches" id="teamColours"></div>
    <div class="field-label">Squad</div>
    <div class="squad-count" id="teamSquadCount"></div>
    <div class="squad-picker" id="teamSquad"></div>
    <div class="form-msg" id="teamMsg" aria-live="polite"></div>
    <div class="modal-actions">
      <button type="button" id="teamDelete" class="danger" hidden>Delete</button>
      <button type="button" id="teamCancel">Cancel</button>
      <button type="button" id="teamSave" class="primary" disabled>Save</button>
    </div>
  </div>
</div>

<!-- Generic confirm -->
<div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal" style="max-width:420px">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button type="button" id="confirmNo">Cancel</button>
      <button type="button" id="confirmYes" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
  const SCORER_PIN = '1234';

  const SUPABASE_URL = 'https://qfuccxknavwivksijkdm.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_NflWkRJmc1SCL2DdQPcl5g_5R51FoWx';

  const STORAGE_KEY = 'pitchside_scorer';

  // ---------- Safe storage ----------
  function storageGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
  }
  function storageRemove(key) {
    try { window.localStorage.removeItem(key); } catch (e) { /* storage unavailable */ }
  }

  // ---------- Role ----------
  const state = {
    role: storageGet(STORAGE_KEY) === SCORER_PIN ? 'scorer' : 'viewer'
  };

  const $ = (id) => document.getElementById(id);

  function renderRole() {
    const isScorer = state.role === 'scorer';
    $('signInBtn').hidden = isScorer;
    $('signOutBtn').hidden = !isScorer;
    $('roleBadge').textContent = isScorer ? 'Scorer' : 'Viewer';
    $('roleBadge').classList.toggle('scorer', isScorer);
    document.body.dataset.role = state.role;
    if (!isScorer) closePlayerPanel();
    renderPlayers();
    if (!isScorer) closeTeamPanel();
    renderTeams();
  }

  // ---------- PIN entry ----------
  let pinBuffer = '';

  function openPin() {
    pinBuffer = '';
    $('pinMsg').textContent = '';
    renderPinDots();
    $('pinOverlay').classList.add('open');
  }
  function closePin() {
    $('pinOverlay').classList.remove('open');
    pinBuffer = '';
  }
  function renderPinDots() {
    const dots = $('pinDots').children;
    for (let i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('filled', i < pinBuffer.length);
    }
  }
  function pinKey(key) {
    if (key === 'clear') { pinBuffer = ''; }
    else if (key === 'back') { pinBuffer = pinBuffer.slice(0, -1); }
    else if (/^\d$/.test(key) && pinBuffer.length < 4) { pinBuffer += key; }
    $('pinMsg').textContent = '';
    renderPinDots();
    if (pinBuffer.length === 4) checkPin();
  }
  function checkPin() {
    if (pinBuffer === SCORER_PIN) {
      storageSet(STORAGE_KEY, SCORER_PIN);
      state.role = 'scorer';
      closePin();
      renderRole();
      return;
    }
    const dots = $('pinDots');
    dots.classList.remove('shake');
    void dots.offsetWidth; // restart animation
    dots.classList.add('shake');
    $('pinMsg').textContent = 'Incorrect PIN. Try again.';
    pinBuffer = '';
    setTimeout(renderPinDots, 250);
  }

  $('pinPad').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-key]');
    if (btn) pinKey(btn.dataset.key);
  });
  $('pinCancel').addEventListener('click', closePin);
  $('pinOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closePin(); });

  // ---------- Confirm modal ----------
  let confirmHandler = null;

  function showConfirm({ title, text, okLabel = 'OK', onConfirm }) {
    $('confirmTitle').textContent = title;
    $('confirmText').textContent = text;
    $('confirmYes').textContent = okLabel;
    confirmHandler = onConfirm;
    $('confirmOverlay').classList.add('open');
  }
  function closeConfirm() {
    $('confirmOverlay').classList.remove('open');
    confirmHandler = null;
  }
  $('confirmNo').addEventListener('click', closeConfirm);
  $('confirmYes').addEventListener('click', () => {
    const fn = confirmHandler;
    closeConfirm();
    if (fn) fn();
  });
  $('confirmOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeConfirm(); });

  // ---------- Keyboard ----------
  document.addEventListener('keydown', (e) => {
    if ($('confirmOverlay').classList.contains('open')) {
      if (e.key === 'Escape') closeConfirm();
      return;
    }
    if ($('teamOverlay').classList.contains('open')) {
      if (e.key === 'Escape') closeTeamPanel();
      else if (e.key === 'Enter' && e.target === $('teamName') && !$('teamSave').disabled) saveTeam();
      return;
    }
    if ($('playerOverlay').classList.contains('open')) {
      if (e.key === 'Escape') closePlayerPanel();
      else if (e.key === 'Enter' && e.target === $('playerName') && !$('playerSave').disabled) savePlayer();
      return;
    }
    if ($('pinOverlay').classList.contains('open')) {
      if (e.key === 'Escape') closePin();
      else if (/^\d$/.test(e.key)) pinKey(e.key);
      else if (e.key === 'Backspace') pinKey('back');
    }
  });

  // ---------- Top bar ----------
  $('signInBtn').addEventListener('click', openPin);
  $('signOutBtn').addEventListener('click', () => {
    showConfirm({
      title: 'Sign out?',
      text: 'You will return to viewer mode on this device.',
      okLabel: 'Sign out',
      onConfirm: () => {
        storageRemove(STORAGE_KEY);
        state.role = 'viewer';
        renderRole();
      }
    });
  });

  // ---------- Supabase ----------
  let sb = null;

  function describeError(err) {
    if (!err) return 'Unknown error';
    if (typeof err === 'string') return err;
    const parts = [err.message, err.details, err.hint].filter(Boolean);
    if (parts.length) return parts.join(' — ') + (err.code ? ` (${err.code})` : '');
    if (err.code) return `Error code ${err.code}`;
    try { return JSON.stringify(err); } catch (e) { return String(err); }
  }

  function setPlayersStatus(text, isError) {
    const el = $('playersStatus');
    el.textContent = text;
    el.classList.toggle('error', !!isError);
  }

  function getClient() {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      throw new Error('Supabase library failed to load from the CDN.');
    }
    if (!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return sb;
  }

  // ---------- Player library ----------
  const FK_VIOLATION = '23503';

  let players = [];
  let playersLoaded = false;

  async function loadPlayers() {
    try {
      const { data, error, status, statusText } = await getClient()
        .from('players')
        .select('id, name, gender')
        .order('name', { ascending: true });

      if (error) {
        const msg = describeError(error);
        throw new Error(msg === '{}' || !msg ? `Request failed: ${status} ${statusText || ''}`.trim() : msg);
      }

      players = data || [];
      playersLoaded = true;
      renderPlayers();
      if (teamsLoaded) renderTeams();
    } catch (err) {
      setPlayersStatus(describeError(err), true);
      console.error('Pitchside player load failed:', err);
    }
  }

  function initials(name) {
    const words = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return '?';
    const first = words[0].charAt(0);
    const last = words.length > 1 ? words[words.length - 1].charAt(0) : '';
    return (first + last).toUpperCase();
  }

  function renderPlayers() {
    const isScorer = state.role === 'scorer';
    $('addPlayerBtn').hidden = !isScorer;
    if (!playersLoaded) return;

    const list = $('playersList');
    list.replaceChildren();

    if (!players.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No players yet';
      list.append(empty);
    }

    for (const p of players) {
      const row = document.createElement(isScorer ? 'button' : 'div');
      row.className = 'player-row';
      if (isScorer) {
        row.type = 'button';
        row.addEventListener('click', () => openPlayerPanel(p));
      }

      const badge = document.createElement('span');
      badge.className = 'initials';
      badge.textContent = initials(p.name);

      const name = document.createElement('span');
      name.className = 'player-name';
      name.textContent = p.name;

      row.append(badge, name);
      if (p.gender === 'F') {
        const tag = document.createElement('span');
        tag.className = 'f-tag';
        tag.textContent = 'F';
        row.append(tag);
      }
      list.append(row);
    }

    const n = players.length;
    setPlayersStatus(`${n === 1 ? 'player' : 'players'} in the library`, false);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = n + ' ';
    $('playersStatus').prepend(num);
  }

  // ---------- Add / edit player panel ----------
  const playerForm = {
    editing: null,      // player object when editing, null when adding
    gender: null,
    dupAcknowledged: false,
    busy: false
  };

  function openPlayerPanel(player) {
    if (state.role !== 'scorer') return;
    playerForm.editing = player || null;
    playerForm.gender = player ? player.gender : null;
    playerForm.dupAcknowledged = false;
    playerForm.busy = false;
    $('playerTitle').textContent = player ? 'Edit player' : 'Add player';
    $('playerName').value = player ? player.name : '';
    $('playerDelete').hidden = !player;
    setPlayerMsg('');
    $('playerSave').textContent = 'Save';
    renderPlayerForm();
    $('playerOverlay').classList.add('open');
    $('playerName').focus();
  }

  function closePlayerPanel() {
    $('playerOverlay').classList.remove('open');
    playerForm.editing = null;
    playerForm.busy = false;
  }

  function setPlayerMsg(text) {
    $('playerMsg').textContent = text;
  }

  function renderPlayerForm() {
    for (const btn of $('playerGender').children) {
      btn.setAttribute('aria-pressed', String(btn.dataset.gender === playerForm.gender));
    }
    const ready = $('playerName').value.trim() !== '' && !!playerForm.gender;
    $('playerSave').disabled = !ready || playerForm.busy;
    $('playerDelete').disabled = playerForm.busy;
  }

  function resetDuplicateWarning() {
    if (!playerForm.dupAcknowledged) return;
    playerForm.dupAcknowledged = false;
    $('playerSave').textContent = 'Save';
    setPlayerMsg('');
  }

  async function savePlayer() {
    if (playerForm.busy) return;
    const name = $('playerName').value.trim();
    const gender = playerForm.gender;
    if (!name || !gender) return;

    if (!playerForm.dupAcknowledged) {
      const editingId = playerForm.editing && playerForm.editing.id;
      const lower = name.toLowerCase();
      const dup = players.find((p) => p.id !== editingId && String(p.name).trim().toLowerCase() === lower);
      if (dup) {
        playerForm.dupAcknowledged = true;
        setPlayerMsg(`Someone called "${name}" already exists. Save anyway?`);
        $('playerSave').textContent = 'Save anyway';
        return;
      }
    }

    playerForm.busy = true;
    setPlayerMsg('');
    renderPlayerForm();
    try {
      const table = getClient().from('players');
      const { error } = playerForm.editing
        ? await table.update({ name, gender }).eq('id', playerForm.editing.id)
        : await table.insert({ name, gender });
      if (error) throw error;
      closePlayerPanel();
      await loadPlayers();
    } catch (err) {
      playerForm.busy = false;
      setPlayerMsg(describeError(err));
      renderPlayerForm();
      console.error('Pitchside player save failed:', err);
    }
  }

  function confirmDeletePlayer() {
    const player = playerForm.editing;
    if (!player || playerForm.busy) return;
    showConfirm({
      title: 'Delete player?',
      text: `"${player.name}" will be removed from the library.`,
      okLabel: 'Delete',
      onConfirm: () => deletePlayer(player)
    });
  }

  async function deletePlayer(player) {
    playerForm.busy = true;
    setPlayerMsg('');
    renderPlayerForm();
    try {
      const { error } = await getClient().from('players').delete().eq('id', player.id);
      if (error) throw error;
      closePlayerPanel();
      await loadPlayers();
    } catch (err) {
      playerForm.busy = false;
      setPlayerMsg(err && err.code === FK_VIOLATION
        ? `${player.name} is in a team and cannot be deleted. Remove them from the team first.`
        : describeError(err));
      renderPlayerForm();
      if (!err || err.code !== FK_VIOLATION) console.error('Pitchside player delete failed:', err);
    }
  }

  $('addPlayerBtn').addEventListener('click', () => openPlayerPanel(null));
  $('playerName').addEventListener('input', () => {
    resetDuplicateWarning();
    renderPlayerForm();
  });
  $('playerGender').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-gender]');
    if (!btn) return;
    playerForm.gender = btn.dataset.gender;
    renderPlayerForm();
  });
  $('playerSave').addEventListener('click', savePlayer);
  $('playerCancel').addEventListener('click', closePlayerPanel);
  $('playerDelete').addEventListener('click', confirmDeletePlayer);
  $('playerOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closePlayerPanel(); });

  // ---------- Teams ----------
  const TEAM_COLOURS = [
    { hex: '#2563EB', ink: '#FFFFFF', label: 'Blue' },
    { hex: '#C2410C', ink: '#FFFFFF', label: 'Orange' },
    { hex: '#0D9488', ink: '#FFFFFF', label: 'Teal' },
    { hex: '#7C3AED', ink: '#FFFFFF', label: 'Purple' },
    { hex: '#E0A800', ink: '#141413', label: 'Amber' },
    { hex: '#DB2777', ink: '#FFFFFF', label: 'Magenta' },
    { hex: '#15803D', ink: '#FFFFFF', label: 'Green' },
    { hex: '#E2E8F0', ink: '#141413', label: 'White' }
  ];

  let teams = [];          // each: { id, name, colour, tournament_id, is_quickplay, memberIds: [playerId] }
  let teamsLoaded = false;

  function setTeamsStatus(text, isError) {
    const el = $('teamsStatus');
    el.textContent = text;
    el.classList.toggle('error', !!isError);
  }

  async function loadTeams() {
    try {
      const { data, error, status, statusText } = await getClient()
        .from('teams')
        .select('id, name, colour, tournament_id, is_quickplay, team_players(player_id)')
        .order('name', { ascending: true });

      if (error) {
        const msg = describeError(error);
        throw new Error(msg === '{}' || !msg ? `Request failed: ${status} ${statusText || ''}`.trim() : msg);
      }

      teams = (data || []).map((t) => ({
        id: t.id,
        name: t.name,
        colour: t.colour,
        tournament_id: t.tournament_id,
        is_quickplay: t.is_quickplay,
        memberIds: (t.team_players || []).map((tp) => tp.player_id)
      }));
      teamsLoaded = true;
      renderTeams();
    } catch (err) {
      setTeamsStatus(describeError(err), true);
      console.error('Pitchside team load failed:', err);
    }
  }

  function countFemales(ids) {
    let n = 0;
    for (const id of ids) {
      const p = players.find((pl) => pl.id === id);
      if (p && p.gender === 'F') n++;
    }
    return n;
  }

  function renderTeams() {
    const isScorer = state.role === 'scorer';
    $('addTeamBtn').hidden = !isScorer;
    if (!teamsLoaded) return;

    const list = $('teamsList');
    list.replaceChildren();

    if (!teams.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No teams yet';
      list.append(empty);
    }

    for (const t of teams) {
      const row = document.createElement(isScorer ? 'button' : 'div');
      row.className = 'player-row';
      if (isScorer) {
        row.type = 'button';
        row.addEventListener('click', () => openTeamPanel(t));
      }

      const dot = document.createElement('span');
      dot.className = 'colour-dot';
      dot.style.background = t.colour;

      const name = document.createElement('span');
      name.className = 'player-name';
      name.textContent = t.name;

      row.append(dot, name);
      if (playersLoaded && countFemales(t.memberIds) === 0) {
        const tag = document.createElement('span');
        tag.className = 'f-tag';
        tag.textContent = 'NO F';
        row.append(tag);
      }

      const size = t.memberIds.length;
      const count = document.createElement('span');
      count.style.cssText = 'margin-left:auto; color:var(--muted); font-size:13px;';
      count.textContent = `${size} ${size === 1 ? 'player' : 'players'}`;
      row.append(count);

      list.append(row);
    }

    const n = teams.length;
    setTeamsStatus(`${n === 1 ? 'team' : 'teams'} registered`, false);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = n + ' ';
    $('teamsStatus').prepend(num);
  }

  // ---------- Add / edit team panel ----------
  const teamForm = { editing: null, colour: TEAM_COLOURS[0].hex, selected: new Set(), busy: false };
  let teamColourNote = '';   // the colour-clash warning currently shown, if any

  function openTeamPanel(team) {
    if (state.role !== 'scorer') return;
    teamForm.editing = team || null;
    teamForm.colour = team ? team.colour : TEAM_COLOURS[0].hex;
    teamForm.selected = new Set(team ? team.memberIds : []);
    teamForm.busy = false;
    $('teamTitle').textContent = team ? 'Edit team' : 'Add team';
    $('teamName').value = team ? team.name : '';
    $('teamDelete').hidden = !team;
    setTeamMsg('');
    $('teamSquad').scrollTop = 0;
    renderTeamForm();
    $('teamOverlay').classList.add('open');
    $('teamName').focus();
  }

  function closeTeamPanel() {
    $('teamOverlay').classList.remove('open');
    teamForm.editing = null;
    teamForm.busy = false;
  }

  function setTeamMsg(text) {
    $('teamMsg').textContent = text;
    teamColourNote = '';
  }

  function renderTeamForm() {
    const swatches = $('teamColours');
    swatches.replaceChildren();
    for (const c of TEAM_COLOURS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch';
      btn.style.background = c.hex;
      btn.setAttribute('aria-pressed', String(c.hex === teamForm.colour));
      btn.setAttribute('aria-label', c.label);
      btn.title = c.label;
      btn.addEventListener('click', () => {
        teamForm.colour = c.hex;
        renderTeamForm();
      });
      swatches.append(btn);
    }

    const squad = $('teamSquad');
    const scroll = squad.scrollTop;
    squad.replaceChildren();
    if (!players.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No players in the library yet';
      squad.append(empty);
    }
    for (const p of players) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'player-row squad-row';
      row.setAttribute('aria-pressed', String(teamForm.selected.has(p.id)));

      const badge = document.createElement('span');
      badge.className = 'initials';
      badge.textContent = initials(p.name);

      const name = document.createElement('span');
      name.className = 'player-name';
      name.textContent = p.name;

      row.append(badge, name);
      if (p.gender === 'F') {
        const tag = document.createElement('span');
        tag.className = 'f-tag';
        tag.textContent = 'F';
        row.append(tag);
      }

      const tick = document.createElement('span');
      tick.className = 'squad-tick';
      tick.textContent = '✓';
      row.append(tick);

      row.addEventListener('click', () => {
        if (teamForm.selected.has(p.id)) teamForm.selected.delete(p.id);
        else teamForm.selected.add(p.id);
        renderTeamForm();
      });
      squad.append(row);
    }
    squad.scrollTop = scroll;

    const females = countFemales(teamForm.selected);
    $('teamSquadCount').textContent = `${teamForm.selected.size} selected · ${females} female`;

    // Colour clash is a warning only. Never overwrite a save/delete error with it.
    if (!teamForm.busy) {
      const editingId = teamForm.editing && teamForm.editing.id;
      const clash = teams.find((t) => t.id !== editingId && t.colour === teamForm.colour);
      const current = $('teamMsg').textContent;
      if (current === '' || current === teamColourNote) {
        if (clash) {
          setTeamMsg(`${clash.name} already uses this colour.`);
          teamColourNote = $('teamMsg').textContent;
        } else if (teamColourNote) {
          setTeamMsg('');
        }
      }
    }

    $('teamSave').disabled = ($('teamName').value.trim() === '') || teamForm.busy;
    $('teamDelete').disabled = teamForm.busy;
  }

  async function saveTeam() {
    if (teamForm.busy) return;
    const name = $('teamName').value.trim();
    if (!name) return;

    teamForm.busy = true;
    renderTeamForm();
    try {
      let teamId;
      let before;
      if (teamForm.editing) {
        const { error } = await getClient().from('teams')
          .update({ name, colour: teamForm.colour })
          .eq('id', teamForm.editing.id);
        if (error) throw error;
        teamId = teamForm.editing.id;
        before = new Set(teamForm.editing.memberIds);
      } else {
        const { data, error } = await getClient().from('teams')
          .insert({ name, colour: teamForm.colour })
          .select('id')
          .single();
        if (error) throw error;
        teamId = data.id;
        before = new Set();
      }

      const removed = [...before].filter((id) => !teamForm.selected.has(id));
      const added = [...teamForm.selected].filter((id) => !before.has(id));

      if (removed.length) {
        const { error } = await getClient().from('team_players')
          .delete()
          .eq('team_id', teamId)
          .in('player_id', removed);
        if (error) throw error;
      }
      if (added.length) {
        const { error } = await getClient().from('team_players')
          .insert(added.map((player_id) => ({ team_id: teamId, player_id })));
        if (error) throw error;
      }

      closeTeamPanel();
      await loadTeams();
    } catch (err) {
      teamForm.busy = false;
      setTeamMsg(describeError(err));
      renderTeamForm();
      console.error('Pitchside team save failed:', err);
    }
  }

  function confirmDeleteTeam() {
    const team = teamForm.editing;
    if (!team || teamForm.busy) return;
    const n = team.memberIds.length;
    const squad = n === 0 ? 'no players' : `${n} ${n === 1 ? 'player' : 'players'}`;
    showConfirm({
      title: 'Delete team?',
      text: `"${team.name}" and its squad of ${squad} will be removed. The players stay in the library.`,
      okLabel: 'Delete',
      onConfirm: () => deleteTeam(team)
    });
  }

  async function deleteTeam(team) {
    teamForm.busy = true;
    setTeamMsg('');
    renderTeamForm();
    try {
      const { error } = await getClient().from('teams').delete().eq('id', team.id);
      if (error) throw error;
      closeTeamPanel();
      await loadTeams();
    } catch (err) {
      teamForm.busy = false;
      setTeamMsg(err && err.code === FK_VIOLATION
        ? `${team.name} has played matches and cannot be deleted.`
        : describeError(err));
      renderTeamForm();
      if (!err || err.code !== FK_VIOLATION) console.error('Pitchside team delete failed:', err);
    }
  }

  $('addTeamBtn').addEventListener('click', () => openTeamPanel(null));
  $('teamName').addEventListener('input', renderTeamForm);
  $('teamSave').addEventListener('click', saveTeam);
  $('teamCancel').addEventListener('click', closeTeamPanel);
  $('teamDelete').addEventListener('click', confirmDeleteTeam);
  $('teamOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeTeamPanel(); });

  // ---------- Screen router ----------
  const SCREENS = { launch: 'screenLaunch', players: 'screenPlayers', teams: 'screenTeams' };
  let currentScreen = 'launch';

  function showScreen(name) {
    currentScreen = name;
    for (const key of Object.keys(SCREENS)) {
      $(SCREENS[key]).hidden = key !== name;
    }
    $('backBtn').hidden = name === 'launch';
    window.scrollTo(0, 0);
  }

  $('backBtn').addEventListener('click', () => showScreen('launch'));
  $('tileTeams').addEventListener('click', () => showScreen('teams'));
  $('tileSetup').addEventListener('click', () => showScreen('players'));

  // ---------- Init ----------
  showScreen('launch');
  renderRole();
  loadPlayers();
  loadTeams();
</script>
</body>
</html>
