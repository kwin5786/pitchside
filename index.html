<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitchside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0E1512;
    --text: #E6EDE9;
    --muted: #9FB0A8;
    --panel: #141D19;
    --border: #2E3B36;
    --btn: #1A2420;
    --green: #2E7D4F;
    --blue: #2563EB;
    --orange: #C2410C;
    --amber: #E0A800;
    --touch: 44px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .num { font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-variant-numeric: tabular-nums; }

  /* ---------- Buttons ---------- */
  button {
    font: inherit;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--border);
    border-radius: 9px;
    min-height: var(--touch);
    min-width: var(--touch);
    padding: 0 16px;
    cursor: pointer;
    font-weight: 600;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  button:active { filter: brightness(1.25); }
  button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }

  /* ---------- Layout ---------- */
  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 16px 24px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }
  .brand {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .role-badge {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .role-badge.scorer { color: #fff; background: var(--green); border-color: var(--green); }

  .panels { display: flex; flex-direction: column; gap: 12px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 14px 16px;
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 600;
  }
  .empty {
    color: var(--muted);
    padding: 10px 0;
  }
  .panel-foot {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--muted);
    word-break: break-word;
  }
  .panel-foot.error { color: var(--amber); }

  /* ---------- Modals ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(5, 9, 7, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    width: 100%;
    max-width: 560px;
    max-height: 100%;
    overflow: auto;
    padding: 16px;
  }
  .modal h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .modal p { margin: 0 0 14px; color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

  /* PIN entry: side-by-side in landscape, stacked on narrow portrait */
  .pin-modal { display: flex; gap: 18px; align-items: stretch; }
  .pin-left {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }
  .pin-dots { display: flex; gap: 12px; margin: 4px 0; }
  .pin-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
  }
  .pin-dot.filled { background: var(--text); border-color: var(--text); }
  .pin-dots.shake { animation: shake 0.35s; }
  .pin-msg { min-height: 20px; font-size: 13px; color: var(--amber); }
  .pin-pad {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-auto-rows: 48px;
    gap: 8px;
  }
  .pin-pad button {
    padding: 0;
    font-family: 'Barlow Condensed', 'Barlow', sans-serif;
    font-size: 24px;
  }
  .pin-pad button.key-fn { font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--muted); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  @media (max-width: 480px) {
    .pin-modal { flex-direction: column; align-items: center; }
    .pin-left { width: 100%; }
  }

  /* Tablet and up */
  @media (min-width: 900px) {
    .app { padding: 16px 24px 32px; }
    .brand { font-size: 30px; }
    .panel { padding: 18px 20px; }
    .panels { gap: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="brand">Pitchside</h1>
    <div class="topbar-right">
      <span id="roleBadge" class="role-badge">Viewer</span>
      <button id="signInBtn" type="button">Scorer sign in</button>
      <button id="signOutBtn" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main class="panels">
    <section class="panel" id="playersPanel">
      <h2>Players</h2>
      <div class="empty">No players yet</div>
      <div class="panel-foot" id="playersStatus">Checking connection…</div>
    </section>

    <section class="panel" id="teamsPanel">
      <h2>Teams</h2>
      <div class="empty">No teams yet</div>
    </section>

    <section class="panel" id="matchesPanel">
      <h2>Matches</h2>
      <div class="empty">No matches yet</div>
    </section>
  </main>
</div>

<!-- PIN entry -->
<div class="overlay" id="pinOverlay" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
  <div class="modal pin-modal">
    <div class="pin-left">
      <div>
        <h3 id="pinTitle">Scorer sign in</h3>
        <p>Enter the 4-digit scorer PIN.</p>
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span><span class="pin-dot"></span>
          <span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <div class="pin-msg" id="pinMsg" aria-live="polite"></div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start">
        <button type="button" id="pinCancel">Cancel</button>
      </div>
    </div>
    <div class="pin-pad" id="pinPad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="clear" class="key-fn">Clear</button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="back" class="key-fn" aria-label="Delete">⌫</button>
    </div>
  </div>
</div>

<!-- Generic confirm -->
<div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal" style="max-width:420px">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button type="button" id="confirmNo">Cancel</button>
      <button type="button" id="confirmYes" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
  const SCORER_PIN = '1234';

  const SUPABASE_URL = 'https://qfuccxknavwivksijkdm.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_NflWkRJmc1SCL2DdQPcl5g_5R51FoWx';

  const STORAGE_KEY = 'pitchside_scorer';

  // ---------- Safe storage ----------
  function storageGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
  }
  function storageRemove(key) {
    try { window.localStorage.removeItem(key); } catch (e) { /* storage unavailable */ }
  }

  // ---------- Role ----------
  const state = {
    role: storageGet(STORAGE_KEY) === SCORER_PIN ? 'scorer' : 'viewer'
  };

  const $ = (id) => document.getElementById(id);

  function renderRole() {
    const isScorer = state.role === 'scorer';
    $('signInBtn').hidden = isScorer;
    $('signOutBtn').hidden = !isScorer;
    $('roleBadge').textContent = isScorer ? 'Scorer' : 'Viewer';
    $('roleBadge').classList.toggle('scorer', isScorer);
    document.body.dataset.role = state.role;
  }

  // ---------- PIN entry ----------
  let pinBuffer = '';

  function openPin() {
    pinBuffer = '';
    $('pinMsg').textContent = '';
    renderPinDots();
    $('pinOverlay').classList.add('open');
  }
  function closePin() {
    $('pinOverlay').classList.remove('open');
    pinBuffer = '';
  }
  function renderPinDots() {
    const dots = $('pinDots').children;
    for (let i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('filled', i < pinBuffer.length);
    }
  }
  function pinKey(key) {
    if (key === 'clear') { pinBuffer = ''; }
    else if (key === 'back') { pinBuffer = pinBuffer.slice(0, -1); }
    else if (/^\d$/.test(key) && pinBuffer.length < 4) { pinBuffer += key; }
    $('pinMsg').textContent = '';
    renderPinDots();
    if (pinBuffer.length === 4) checkPin();
  }
  function checkPin() {
    if (pinBuffer === SCORER_PIN) {
      storageSet(STORAGE_KEY, SCORER_PIN);
      state.role = 'scorer';
      closePin();
      renderRole();
      return;
    }
    const dots = $('pinDots');
    dots.classList.remove('shake');
    void dots.offsetWidth; // restart animation
    dots.classList.add('shake');
    $('pinMsg').textContent = 'Incorrect PIN. Try again.';
    pinBuffer = '';
    setTimeout(renderPinDots, 250);
  }

  $('pinPad').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-key]');
    if (btn) pinKey(btn.dataset.key);
  });
  $('pinCancel').addEventListener('click', closePin);
  $('pinOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closePin(); });

  // ---------- Confirm modal ----------
  let confirmHandler = null;

  function showConfirm({ title, text, okLabel = 'OK', onConfirm }) {
    $('confirmTitle').textContent = title;
    $('confirmText').textContent = text;
    $('confirmYes').textContent = okLabel;
    confirmHandler = onConfirm;
    $('confirmOverlay').classList.add('open');
  }
  function closeConfirm() {
    $('confirmOverlay').classList.remove('open');
    confirmHandler = null;
  }
  $('confirmNo').addEventListener('click', closeConfirm);
  $('confirmYes').addEventListener('click', () => {
    const fn = confirmHandler;
    closeConfirm();
    if (fn) fn();
  });
  $('confirmOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeConfirm(); });

  // ---------- Keyboard ----------
  document.addEventListener('keydown', (e) => {
    if ($('confirmOverlay').classList.contains('open')) {
      if (e.key === 'Escape') closeConfirm();
      return;
    }
    if ($('pinOverlay').classList.contains('open')) {
      if (e.key === 'Escape') closePin();
      else if (/^\d$/.test(e.key)) pinKey(e.key);
      else if (e.key === 'Backspace') pinKey('back');
    }
  });

  // ---------- Top bar ----------
  $('signInBtn').addEventListener('click', openPin);
  $('signOutBtn').addEventListener('click', () => {
    showConfirm({
      title: 'Sign out?',
      text: 'You will return to viewer mode on this device.',
      okLabel: 'Sign out',
      onConfirm: () => {
        storageRemove(STORAGE_KEY);
        state.role = 'viewer';
        renderRole();
      }
    });
  });

  // ---------- Supabase ----------
  let sb = null;

  function describeError(err) {
    if (!err) return 'Unknown error';
    if (typeof err === 'string') return err;
    const parts = [err.message, err.details, err.hint].filter(Boolean);
    if (parts.length) return parts.join(' — ') + (err.code ? ` (${err.code})` : '');
    if (err.code) return `Error code ${err.code}`;
    try { return JSON.stringify(err); } catch (e) { return String(err); }
  }

  function setPlayersStatus(text, isError) {
    const el = $('playersStatus');
    el.textContent = text;
    el.classList.toggle('error', !!isError);
  }

  async function checkConnection() {
    try {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        throw new Error('Supabase library failed to load from the CDN.');
      }
      if (!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const { count, error, status, statusText } = await sb
        .from('players')
        .select('*', { count: 'exact', head: true });

      if (error) {
        const msg = describeError(error);
        throw new Error(msg === '{}' || !msg ? `Request failed: ${status} ${statusText || ''}`.trim() : msg);
      }

      const n = count || 0;
      setPlayersStatus(`${n === 1 ? 'player' : 'players'} in the library`, false);
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = n + ' ';
      $('playersStatus').prepend(num);
    } catch (err) {
      setPlayersStatus(describeError(err), true);
      console.error('Pitchside connection check failed:', err);
    }
  }

  // ---------- Init ----------
  renderRole();
  checkConnection();
</script>
</body>
</html>
